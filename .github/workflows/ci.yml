name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Lint
        # The repo's `lint` script passes --fix, which would silently rewrite
        # files in CI and still pass. Run the same config read-only instead.
        run: npx eslint "{src,test}/**/*.ts" --max-warnings 0

      - name: Check formatting
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

      - name: Coverage
        if: matrix.node == '20'
        run: npm run test:cov

      - name: Build
        run: npm run build

  write-access-guard:
    # Writes to /jobs used to be open whenever ADMIN_API_KEY was unset, which
    # is how the deployed API was running. This job boots the real server
    # against a real Postgres and proves writes are refused by default.
    name: writes fail closed by default
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobs_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jobs_test
      DB_SSL: disable
      HOST: 127.0.0.1
      PORT: '3001'
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build

      - name: With nothing configured, reads work and writes are 503
        run: |
          set -euo pipefail
          node dist/main > server.log 2>&1 & SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3001/ > /dev/null && break
            sleep 1
          done

          curl -fsS http://127.0.0.1:3001/jobs > /dev/null
          echo "reads OK"

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3001/jobs \
            -H 'Content-Type: application/json' -d '{"title":"Pwned","companyName":"x"}')
          test "$code" = "503" || { echo "::error::anonymous POST returned $code, expected 503"; cat server.log; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE http://127.0.0.1:3001/jobs/1)
          test "$code" = "503" || { echo "::error::anonymous DELETE returned $code, expected 503"; exit 1; }

          grep -q "Write access: DISABLED" server.log \
            || { echo "::error::startup did not warn that writes are disabled"; cat server.log; exit 1; }
          echo "writes correctly refused"

      - name: With ADMIN_API_KEY set, only the right key writes
        env:
          ADMIN_API_KEY: ci-only-admin-key
          PORT: '3002'
        run: |
          set -euo pipefail
          node dist/main > server2.log 2>&1 & SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3002/ > /dev/null && break
            sleep 1
          done

          job='{"title":"Backend Engineer","companyName":"Acme","location":"Remote","jobType":"Full-time","workMode":"Remote","experience":"1-3 yrs","salary":"10 LPA","salaryRange":"₹5,00,000 - ₹10,00,000","description":"Build things.","applicationDeadline":"2030-01-31"}'

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3002/jobs \
            -H 'Content-Type: application/json' -d "$job")
          test "$code" = "401" || { echo "::error::missing key returned $code, expected 401"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3002/jobs \
            -H 'Content-Type: application/json' -H 'x-admin-key: wrong-key' -d "$job")
          test "$code" = "401" || { echo "::error::wrong key returned $code, expected 401"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3002/jobs \
            -H 'Content-Type: application/json' -H 'x-admin-key: ci-only-admin-key' -d "$job")
          test "$code" = "201" || { echo "::error::correct key returned $code, expected 201"; cat server2.log; exit 1; }

          grep -q "x-admin-key" server2.log \
            || { echo "::error::startup did not report the api-key mode"; exit 1; }
          echo "api-key mode OK"

      - name: Swagger docs are served
        env:
          PORT: '3003'
          ADMIN_API_KEY: ci-only-admin-key
        run: |
          set -euo pipefail
          node dist/main > server3.log 2>&1 & SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3003/ > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3003/api-docs/ | grep -qi swagger

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://cybermind-backend.onrender.com

  docker:
    name: backend image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: true
          tags: job-management-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image refuses to start without DATABASE_URL
        run: |
          output=$(docker run --rm job-management-backend:ci 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "DATABASE_URL" \
            || { echo "::error::expected a DATABASE_URL configuration error"; exit 1; }
