services:
  - type: web
    name: cybermind-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        sync: false
      # Writes fail closed without this. Render generates a value on first
      # deploy; read it from the dashboard and send it as x-admin-key.
      # To run an intentionally public, writable demo instead, delete this and
      # add ALLOW_PUBLIC_WRITES=true — anyone will then be able to edit jobs.
      - key: ADMIN_API_KEY
        generateValue: true
    healthCheckPath: / 