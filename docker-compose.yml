# Local development stack: Postgres + the NestJS API.
#
# Every published port is bound to 127.0.0.1, so nothing here is reachable from
# the local network. The API reaches Postgres over the compose network on the
# `db` hostname; the database publish is only a convenience for psql.
#
#   printf 'POSTGRES_PASSWORD=%s\nADMIN_API_KEY=%s\n' \
#     "$(openssl rand -hex 16)" "$(openssl rand -hex 24)" > .env
#   docker compose up --build
#   open http://localhost:3001/api-docs

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobs
      POSTGRES_USER: jobs
      # No default: compose refuses to start until this is set in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://jobs:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/jobs
      DB_SSL: disable
      FRONTEND_URL: http://localhost:3000
      # Writes fail closed without this. Set ALLOW_PUBLIC_WRITES=true instead
      # only if you deliberately want an unauthenticated, writable instance.
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in .env (openssl rand -hex 24)}
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  pgdata:
